name: absensi_app
description: Aplikasi absensi karyawan (Flutter + Node.js)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  intl: ^0.19.0
  provider: ^6.1.2
  url_launcher: ^6.3.0
  geocoding: ^3.0.0
  google_mlkit_face_detection: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
